<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e4a3c">
<title>年辽的知识工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%232e4a3c'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fffdf6' font-family='serif'>辽</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="年辽工作台">
</head>
<body>
<div class="app">

  <!-- 书脊导航（桌面） -->
  <aside class="side">
    <div class="brand">
      <h1>年辽的知识工作台</h1>
      <div class="sub">私人书房 · 编辑工作室</div>
    </div>
    <nav id="desktop-nav"></nav>
    <div class="motto">
      一句自勉：<br>
      <b>把日子过成手稿，</b><br>
      <b>让灵感有处安放。</b>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div class="today" id="topdate"></div>
      <label class="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="quick-search" type="search" placeholder="搜索一切 · 回车">
      </label>
      <span class="spacer"></span>
      <button class="btn ghost desk-only" data-action="new-idea">✦ 记灵感</button>
      <button class="btn desk-only" data-action="new-project">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建项目
      </button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- 手机底部导航 -->
<nav class="bottomnav" id="mobile-nav"></nav>

<!-- 手机悬浮新建 -->
<div class="fab">
  <button class="wine" data-action="new-idea" title="记灵感">✦</button>
  <button data-action="new-project" title="新建项目">＋</button>
</div>

<div id="modal-root"></div>

<script src="js/app.js"></script>
<script>
/* 注册 Service Worker：本机 file:// 打开时自动跳过，不影响双击使用 */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
